[project]
name = "sonny"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python>=5.0.0.93",
    "reachy-mini==1.11.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
]
experiments = [
    "coremltools>=8.0,<10.0",
    "onnx>=1.16,<2",
    "onnxruntime>=1.27.0",
    "openwakeword>=0.6.0",
    "parakeet-mlx>=0.5.3",
    "pipecat-ai[kokoro,mlx-whisper,openrouter,pocket-tts,silero]>=1.12",
    "psutil>=7.2.2",
    "rfdetr>=1.11.2",
]

[tool.uv]
# Everything runs on the Mac (ADR 0001); openwakeword 0.6 needs tflite-runtime on Linux, which has no py3.12 wheels.
environments = ["sys_platform == 'darwin'"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
