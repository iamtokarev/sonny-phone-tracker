name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.5"
      # web/node_modules is not installed here; the web job runs ESLint instead.
      - run: uvx --python 3.12 pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: web-eslint

  test:
    name: Unit tests
    # The lockfile is macOS-only (ADR 0001: everything runs on the Mac).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  web:
    name: Dashboard frontend (web/)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.3"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # check:protocol regenerates the types from the Python models, so it needs the uv env.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bunx vite build
      - run: uv sync --locked
        working-directory: .
      - run: bun run check:protocol
